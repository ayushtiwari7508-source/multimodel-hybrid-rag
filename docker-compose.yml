services:
  api:
    build: .
    image: hybrid-rag:latest
    ports:
      - "${API_PORT:-8000}:8000"
    environment:
      - OLLAMA_BASE_URL=http://host.docker.internal:11434
      - CHROMA_PERSIST_DIR=/data/chroma
      - BM25_PERSIST_PATH=/data/bm25/index.pkl
      - META_PERSIST_DIR=/data/index_meta
      - API_KEY=${API_KEY:-}
      - RATE_LIMIT_PER_MIN=${RATE_LIMIT_PER_MIN:-60}
    volumes:
      - rag-data:/data
    extra_hosts:
      - "host.docker.internal:host-gateway"
    restart: unless-stopped

  ui:
    build: .
    command: streamlit run ui/streamlit_app.py --server.port 8501 --server.address 0.0.0.0
    depends_on:
      - api
    ports:
      - "${STREAMLIT_PORT:-8501}:8501"
    environment:
      - RAG_API_URL=http://api:8000
      - RAG_API_KEY=${RAG_API_KEY:-}
    restart: unless-stopped

volumes:
  rag-data: