[tool.ruff]
line-length = 120
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "C4", "PLW", "S", "RUF"]
ignore = [
    "BLE001",  # broad Exception catches at app/UI boundaries are intentional
    "B008",    # FastAPI Depends() in default args
    "S110",    # subprocess without check in launcher scripts
    "S112",    # subprocess with check=False in launcher scripts
    "PLW1510", # subprocess without explicit check=
    "S603",    # subprocess without shell safety proof in scripts
]

[tool.ruff.lint.per-file-ignores]
"frontend/*.py" = ["E501"]
"scripts/*.py" = ["E501", "PLW2901", "E402", "S607", "S104"]
"tests/*.py" = ["S101"]
"tests/**/*.py" = ["S101"]
